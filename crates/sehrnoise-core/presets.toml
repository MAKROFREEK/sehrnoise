# sehrnoise presets — the tuning surface.
#
# Each entry is a curve over the eight bands (31 Hz ... 13.0 kHz). The values are
# the gain of that band in dB, relative to a flat spectrum. Edit this file and
# rebuild: `build.rs` turns it into the preset table the plugin and the
# standalone app share.
#
# band_gains_db:  -80 .. +80 (T7.3 widened the range so the reference-matched
#                 presets fit; the six curves below were fitted to the
#                 recordings in `noise_references/` by `tools/spectest`
#                 `refsolve`)
# trim_db:        the output trim the preset plays at, in dB, added to the
#                 master gain. Keeps a heavily shaped preset out of the
#                 limiter, so the spectrum that plays is the spectrum that
#                 was fitted. Optional, default 0.
# seed:           the seed of the random curve
# randomize:      true makes the preset re-roll the band gains instead of
#                 using the values above

[[preset]]
name = "White"
bands_db = [1.69, -0.15, 0.08, 0.07, 0.28, -0.08, -0.73, -1.17]
seed = 0
warp = "Reset"
width = "Normal"
trim_db = -36.96

